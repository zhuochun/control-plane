name: Go quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version-file: .golangci-lint-version
          install-only: true
      - run: pwsh -File scripts/test.ps1 -Suite main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-output/run-*/
          retention-days: 14
