name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -trimpath -o dist/aicp ./cmd/aicp
      - run: npx --prefix web playwright install --with-deps chromium
      - run: npm --prefix web run test:e2e

  verify-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: npx --prefix web playwright install chromium
      - shell: pwsh
        run: .\scripts\verify.ps1
      - run: go install github.com/goreleaser/goreleaser/v2@v2.18.1
      - shell: pwsh
        run: |
          & (Join-Path (go env GOPATH) 'bin\goreleaser.exe') release --snapshot --clean
          .\scripts\smoke-package.ps1

  release:
    needs: [verify-linux, verify-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.18.1
          args: release --clean ${{ github.ref_type != 'tag' && '--snapshot' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
