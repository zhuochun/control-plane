name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: golangci/golangci-lint-action@v9
        with:
          version-file: .golangci-lint-version
          install-only: true
      - run: pwsh -File scripts/testing/provision-renderer.ps1
      - run: pwsh -File scripts/test.ps1 -Suite release -Profile renderer
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verification-linux
          path: test-output/run-*/
          retention-days: 14

  verify-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version-file: .golangci-lint-version
          install-only: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - shell: pwsh
        run: .\scripts\testing\provision-renderer.ps1
      - shell: pwsh
        run: .\scripts\test.ps1 -Suite release -Profile renderer
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verification-windows
          path: test-output/run-*/
          retention-days: 14
      - run: go install github.com/goreleaser/goreleaser/v2@v2.18.1
      - shell: pwsh
        run: |
          & (Join-Path (go env GOPATH) 'bin\goreleaser.exe') release --snapshot --clean
          .\scripts\smoke-package.ps1

  release:
    needs: [verify-linux, verify-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.18.1
          args: release --clean ${{ github.ref_type != 'tag' && '--snapshot' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
